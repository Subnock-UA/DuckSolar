name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r pc-client/requirements.txt
      - run: python tools/audit_public.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s pc-client/tests -v

